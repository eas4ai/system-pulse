# The existing dependency licenses, in preferred notice order.
# cargo-about 0.9.2 resolves pinned upstream notices where crate archives omit them.
accepted = ["Apache-2.0", "MIT", "BSD-3-Clause", "BSD-2-Clause", "ISC", "Unicode-3.0", "Zlib", "0BSD", "CC0-1.0", "CDLA-Permissive-2.0", "Apache-2.0 WITH LLVM-exception", "MPL-2.0", "bzip2-1.0.6", "GPL-3.0-or-later"]
targets = ["x86_64-unknown-linux-gnu"]
ignore-dev-dependencies = true
ignore-build-dependencies = false
ignore-transitive-dependencies = false

# Upstream f66ed399 omits the manifest field but ships this Apache notice.
[gpui_shared_string.clarify]
license = "Apache-2.0"
[[gpui_shared_string.clarify.files]]
path = "LICENSE-APACHE"
checksum = "752daf2fb234ca4a1fa372c073fe127f44b7b90fd2529ae44273a64f9d53da7a"

# Upstream f66ed399 omits the manifest field but ships this Apache notice.
[gpui_util.clarify]
license = "Apache-2.0"
[[gpui_util.clarify.files]]
path = "LICENSE-APACHE"
