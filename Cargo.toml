[package]
name = "system-pulse"
version = "0.1.0"
edition.workspace = true
license = "GPL-3.0-or-later"
publish = false

[dependencies]
gpui.workspace = true
gpui_platform.workspace = true
gpui-base.workspace = true
gpui-component.workspace = true
gpui-component-assets.workspace = true
serde.workspace = true
serde_json.workspace = true
system-pulse-collectors = { path = "crates/collectors" }
smol.workspace = true
system-pulse-model = { path = "crates/model" }

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }

[lints]
workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"

[[test]]
name = "macos_application_lifetime"
path = "tests/macos_application_lifetime.rs"
harness = false

[target.'cfg(target_os = "macos")'.dev-dependencies]
anyhow.workspace = true
async-task = "4.7"
dispatch2 = "0.3.1"
futures = "0.3.32"
gpui_util = { git = "https://github.com/zed-industries/zed" }
libc = "0.2"
mach2 = "0.5"
objc = "0.2"
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["NSObject", "NSProcessInfo", "NSString", "std"] }

[workspace]
default-members = ["."]
members = [".", "crates/model", "crates/collectors", "crates/base", "crates/macros", "crates/ui", "crates/assets"]
exclude = ["vendor/accesskit_atspi_common", "vendor/gpui_macos"]
resolver = "2"

[workspace.package]
publish = false
edition = "2024"

[workspace.dependencies]
gpui-component = { path = "crates/ui", version = "0.5.2" }
gpui-base = { path = "crates/base", version = "0.5.2" }
gpui-component-macros = { path = "crates/macros", version = "0.5.1" }
gpui-component-assets = { path = "crates/assets", version = "0.5.1" }

gpui = { version = "0.2.2", git = "https://github.com/zed-industries/zed" }
gpui_platform = { git = "https://github.com/zed-industries/zed", features = ["font-kit", "x11", "wayland", "runtime_shaders"] }
gpui_macros = { version = "0.1.0", git = "https://github.com/zed-industries/zed" }
reqwest_client = { git = "https://github.com/zed-industries/zed" }
sum-tree = { version = "0.2.0", package = "zed-sum-tree" }
# reqwest = { version = "0.12.15-zed", package = "zed-reqwest" }
reqwest = { git = "https://github.com/zed-industries/reqwest.git", rev = "c15662463bda39148ba154100dd44d3fba5873a4", default-features = false, features = [
    "charset",
    "http2",
    "macos-system-configuration",
    "multipart",
    "rustls-tls-native-roots",
    "socks",
    "stream",
], package = "zed-reqwest", version = "0.12.15-zed" }

anyhow = "1"
instant = { version = "0.1", features = ["wasm-bindgen"] }
log = "0.4"
lsp-types = { version = "0.97.0", features = ["proposed"] }
notify = "7.0.0"
raw-window-handle = "0.6.2"
ropey = { version = "=2.0.0-beta.1", features = [
    "metric_chars",
    "metric_lines_lf",
    "metric_utf16",
] }
rust-i18n = "4.2.0"
schemars = "1"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1"
serde_repr = "0.1"
smallvec = "1"
smol = "2"
syntect = { version = "5.3.0", default-features = false, features = [
    "parsing",
    "default-syntaxes",
    "regex-fancy",
] }
tracing = "0.1.41"

[workspace.dependencies.windows]
features = ["Wdk", "Wdk_System", "Wdk_System_SystemServices"]
version = "0.58.0"

[workspace.lints.clippy]
almost_complete_range = "allow"
arc_with_non_send_sync = "allow"
borrowed_box = "allow"
dbg_macro = "deny"
let_underscore_future = "allow"
manual_is_multiple_of = "allow"
map_entry = "allow"
module_inception = "allow"
non_canonical_partial_ord_impl = "allow"
reversed_empty_ranges = "allow"
single_range_in_vec_init = "allow"
style = { level = "allow", priority = -1 }
todo = "deny"
type_complexity = "allow"
# Temporarily allow this until we can migrate to the new APIs.
# https://github.com/longbridge/gpui-component/pull/2149
useless_conversion = "allow"

[profile.dev]
codegen-units = 16
debug = "limited"
split-debuginfo = "unpacked"

[profile.dev.package]
resvg = { opt-level = 3 }
rustybuzz = { opt-level = 3 }
taffy = { opt-level = 3 }
ttf-parser = { opt-level = 3 }
smol = { opt-level = 3 }
gpui = { opt-level = 3 }
gpui_platform = { opt-level = 3 }
gpui_macros = { opt-level = 3 }
tree-sitter = { opt-level = 3 }
sum_tree = { opt-level = 3 }
ropey = { opt-level = 3 }
lsp-types = { opt-level = 3 }
reqwest_client = { opt-level = 3 }
markdown = { opt-level = 3 }
xml5ever = { opt-level = 3 }

# Preserve the pinned adapter while fixing native expansion state exposure.
[patch.crates-io]
accesskit_atspi_common = { path = "vendor/accesskit_atspi_common" }

# Keep the locked Zed graph; patch only the macOS dispatcher lifetime boundary.
[patch."https://github.com/zed-industries/zed"]
gpui_macos = { path = "vendor/gpui_macos" }
