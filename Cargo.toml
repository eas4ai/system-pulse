[package]
name = "system-pulse"
version = "0.3.0"
edition.workspace = true
license = "GPL-3.0-or-later"
publish = false

[dependencies]
gpui-kit = "=0.6.0"
gpui-tray = { git = "https://github.com/eas4ai/gpui-kit-tray", rev = "5e0f637069e6d5ba8bdee6872f1ed935348642a0" }
serde.workspace = true
serde_json.workspace = true
system-pulse-collectors = { path = "crates/collectors" }
smol.workspace = true
system-pulse-model = { path = "crates/model" }

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
gpui-kit = { version = "=0.6.0", features = ["test-support"] }

[lints]
workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"

[[test]]
name = "macos_application_lifetime"
path = "tests/macos_application_lifetime.rs"
harness = false

[target.'cfg(target_os = "macos")'.dev-dependencies]
anyhow.workspace = true
async-task = "4.7"
dispatch2 = "0.3.1"
futures = "0.3.32"
gpui_util = { package = "gpui-pre-util", version = "=0.3.2" }
libc = "0.2"
mach2 = "0.5"
objc = "0.2"
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["NSObject", "NSProcessInfo", "NSString", "std"] }

[workspace]
default-members = ["."]
members = [".", "crates/model", "crates/collectors", "crates/base", "crates/ui"]
exclude = ["vendor/accesskit_unix", "vendor/accesskit_atspi_common", "vendor/gpui_macos", "vendor/sysinfo"]
resolver = "2"

[workspace.package]
publish = false
edition = "2024"

[workspace.dependencies]
gpui-component = { path = "crates/ui", version = "=0.6.0" }
gpui-base = { path = "crates/base", version = "=0.6.0" }
gpui-component-macros = "=0.6.0"
gpui-kit-assets = "=0.6.0"

gpui = { package = "gpui-pre", version = "=0.3.2" }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.2", features = ["font-kit", "x11", "wayland", "runtime_shaders"] }
gpui_macros = { package = "gpui-pre-macros", version = "=0.3.2" }
reqwest_client = { package = "gpui-pre-reqwest-client", version = "=0.3.2" }
sum-tree = { package = "gpui-pre-sum-tree", version = "=0.3.2" }
reqwest = { package = "gpui-pre-reqwest", version = "=0.12.15", default-features = false, features = [
    "charset",
    "http2",
    "macos-system-configuration",
    "multipart",
    "rustls-tls-native-roots",
    "socks",
    "stream",
] }

anyhow = "1"
instant = { version = "0.1", features = ["wasm-bindgen"] }
log = "0.4"
lsp-types = { version = "0.97.0", features = ["proposed"] }
notify = "7.0.0"
raw-window-handle = "0.6.2"
ropey = { version = "=2.0.0-beta.1", features = [
    "metric_chars",
    "metric_lines_lf",
    "metric_utf16",
] }
rust-i18n = "4.2.0"
schemars = "1"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1"
serde_repr = "0.1"
smallvec = "1"
smol = "2"
syntect = { version = "5.3.0", default-features = false, features = [
    "parsing",
    "default-syntaxes",
    "regex-fancy",
] }
tracing = "0.1.41"

[workspace.dependencies.windows]
features = ["Wdk", "Wdk_System", "Wdk_System_SystemServices"]
version = "0.58.0"

[workspace.lints.clippy]
almost_complete_range = "allow"
arc_with_non_send_sync = "allow"
borrowed_box = "allow"
dbg_macro = "deny"
let_underscore_future = "allow"
manual_is_multiple_of = "allow"
map_entry = "allow"
module_inception = "allow"
non_canonical_partial_ord_impl = "allow"
reversed_empty_ranges = "allow"
single_range_in_vec_init = "allow"
style = { level = "allow", priority = -1 }
todo = "deny"
type_complexity = "allow"
# Temporarily allow this until we can migrate to the new APIs.
# https://github.com/longbridge/gpui-component/pull/2149
useless_conversion = "allow"

[profile.dev]
codegen-units = 16
debug = "limited"
split-debuginfo = "unpacked"

[profile.dev.package]
resvg = { opt-level = 3 }
rustybuzz = { opt-level = 3 }
taffy = { opt-level = 3 }
ttf-parser = { opt-level = 3 }
smol = { opt-level = 3 }
gpui-pre = { opt-level = 3 }
gpui-pre-platform = { opt-level = 3 }
gpui-pre-macros = { opt-level = 3 }
tree-sitter = { opt-level = 3 }
gpui-pre-sum-tree = { opt-level = 3 }
ropey = { opt-level = 3 }
lsp-types = { opt-level = 3 }
gpui-pre-reqwest-client = { opt-level = 3 }
markdown = { opt-level = 3 }
xml5ever = { opt-level = 3 }

# Keep application-specific library behavior and native fixes on the released graph.
[patch.crates-io]
gpui-base = { path = "crates/base" }
gpui-component = { path = "crates/ui" }
accesskit_atspi_common = { path = "vendor/accesskit_atspi_common" }
accesskit_unix = { path = "vendor/accesskit_unix" }
gpui-pre-macos = { path = "vendor/gpui_macos" }
sysinfo = { path = "vendor/sysinfo" }
